<!DOCTYPE html>
<!-- The second page of the made-up product: plain text, shows no data. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ giúp · Kho sách</title>
<style>
  :root { --ink: #1B1F2A; --blue: #2457D6; --text: #1B1F2A; --text-2: #5B6270; --on-ink: #F7F6F3; --page: #F4F3EF; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px; color: var(--text); }
  .app { min-height: 100vh; background: var(--page); }
  .topbar { height: 56px; background: var(--ink); color: var(--on-ink); display: flex; align-items: center; justify-content: space-between; padding: 0 40px; }
  .topbar strong { font-size: 16px; }
  .main { padding: 32px 40px; }
  h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  p { margin: 0 0 12px; }
  .lead { color: var(--text-2); }
  .back { display: inline-block; line-height: 20px; color: var(--blue); text-decoration: underline; }
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><strong>Kho sách</strong><span>Lan Phạm</span></header>
  <main class="main">
    <h1>Trợ giúp</h1>
    <p class="lead">Kho sách giúp theo dõi số lượng của từng đầu sách.</p>
    <p>Bấm vào một dòng của bảng để xem chi tiết đầu sách. Bấm “Thêm sách” để ghi một đầu sách mới.</p>
    <p><a class="back" href="index.html">Quay lại Kho sách</a></p>
  </main>
</div>
</body>
</html>
