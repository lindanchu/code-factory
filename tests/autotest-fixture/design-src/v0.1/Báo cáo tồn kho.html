<!DOCTYPE html>
<!-- A made-up design page that does NOT take data from outside: it always draws its own numbers. The index of the
     package says so (takes_data: false), and a state of this page is never compared with the web. -->
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Báo cáo tồn kho</title>
<style>
  html, body { margin: 0; }
  body { font-family: Arial, Helvetica, sans-serif; font-size: 14px; line-height: 20px; color: #1B1F2A; background: #F4F3EF; }
  .r-main { padding: 32px 40px; }
  .r-h1 { margin: 0 0 16px; font-size: 24px; line-height: 32px; font-weight: 600; }
  .r-line { margin: 0 0 8px; }
</style>
</head>
<body>
<div id="dc-root">
  <div class="r-main">
    <h1 class="r-h1">Báo cáo tồn kho</h1>
    <p class="r-line">Còn hàng: 2 đầu sách</p>
    <p class="r-line">Hết hàng: 1 đầu sách</p>
  </div>
</div>
</body>
</html>
